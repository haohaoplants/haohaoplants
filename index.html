<!DOCTYPE html>
<html lang="de">
<head>
  <script src="plants-data.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haohao's Plants - Anthurium Collection</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              200: '#bbf7d0',
              600: '#16a34a',
              800: '#166534',
              900: '#14532d',
              950: '#052e16',
            },
            sand: {
              50: '#fdfbf7',
              100: '#f7f3eb',
              200: '#efe6d5',
            }
          },
          fontFamily: {
            serif: ['Playfair Display', 'serif'],
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fdfbf7; }
    h1, h2, h3, .font-serif { font-family: 'Playfair Display', serif; }
  </style>
</head>
<body class="text-slate-800 flex flex-col min-h-screen">

  <!-- Header / Navigation -->
  <header class="sticky top-0 z-30 bg-sand-50/90 backdrop-blur-md border-b border-sand-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-full bg-brand-800 text-sand-50 flex items-center justify-center font-serif text-xl font-bold">H</div>
        <div>
          <a href="#" class="font-serif text-2xl font-bold text-brand-950 tracking-wide">Haohao's Plants</a>
          <p class="text-xs text-brand-800 font-medium tracking-wider uppercase">Leipzig • Anthurium Specialist</p>
        </div>
      </div>

      <div class="flex items-center space-x-4">
        <!-- Language Switcher -->
        <div class="inline-flex rounded-lg p-1 bg-sand-200 text-xs font-semibold">
          <button id="lang-de" onclick="setLanguage('de')" class="px-3 py-1.5 rounded-md transition-all bg-white text-brand-950 shadow-sm">DE</button>
          <button id="lang-en" onclick="setLanguage('en')" class="px-3 py-1.5 rounded-md transition-all text-slate-600 hover:text-brand-950">EN</button>
        </div>

        <a href="https://instagram.com/haohao_plants" target="_blank" class="p-2 text-slate-600 hover:text-brand-800 transition-colors">
          <i class="fa-brands font-lg fa-instagram text-xl"></i>
        </a>
      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="bg-gradient-to-b from-sand-100 to-sand-50 py-12 md:py-16 border-b border-sand-200">
    <div class="max-w-4xl mx-auto text-center px-4">
      <span class="inline-block px-3 py-1 bg-brand-100 text-brand-800 rounded-full text-xs font-semibold uppercase tracking-wider mb-4" data-i18n="hero-badge">Anthurium Collection</span>
      <h1 class="text-4xl md:text-5xl font-bold text-brand-950 mb-4 leading-tight" data-i18n="hero-title">Anthurium Sammlerstücke</h1>
      <p class="text-base md:text-lg text-slate-600 mb-8 max-w-2xl mx-auto" data-i18n="hero-desc">Sorgfältig kultivierte und gesunde Anthurien in Leipzig. Klicke auf eine Pflanze, um Detailfotos und verschiedene Exemplare zu sehen!</p>
      
      <!-- Quick Contact Badges -->
      <div class="space-y-2 max-w-md mx-auto">
        <a href="https://instagram.com/haohao_plants" target="_blank" class="w-full py-3 px-4 bg-slate-900 hover:bg-slate-800 text-white font-medium rounded-xl text-sm flex items-center justify-center gap-2 transition shadow-sm">
          <i class="fa-brands fa-instagram text-lg"></i>
          <span data-i18n="inquire-ig">DM on Instagram</span>
        </a>
        <a id="detail-wa-btn" href="https://wa.me/4917656732766" target="_blank" class="w-full py-2.5 px-4 bg-sand-100 hover:bg-sand-200 text-slate-800 font-medium rounded-xl text-sm flex items-center justify-center gap-2 transition">
          <i class="fa-brands fa-whatsapp text-lg"></i>
          <span data-i18n="inquire-wa">Inquiry via WhatsApp</span>
        </a>
      </div>
    </div>
  </section>

  <!-- Main Product Section -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-grow">
    <div class="flex items-center justify-between mb-8 border-b border-sand-200 pb-4">
      <h2 class="text-2xl font-bold font-serif text-brand-950">Anthurium</h2>
      <span class="text-sm text-slate-500" id="item-count">1 Exemplar</span>
    </div>

    <!-- Plant Cards Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8" id="plant-grid">
      <!-- Plant Cards injected via JS -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-brand-950 text-sand-200 mt-16 border-t border-brand-900">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-8">
        <div>
          <h3 class="font-serif text-xl text-white font-bold mb-3">
